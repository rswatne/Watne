<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Test Side - Sjimpanse</title>

    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #0284c7;
            --primary-deep: #0369a1;
            --card: #ffffff;
            --bg: #f1f5f9;
            --ink: #0f172a;
            --muted: #64748b;
            --line: #cbd5e1;
            --shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.08);
        }

        body.dark-mode {
            --primary: #38bdf8;
            --primary-deep: #0284c7;
            --card: #0f172a;
            --bg: #070a11;
            --ink: #f8fafc;
            --muted: #94a3b8;
            --line: #1e293b;
            --shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.6);
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg);
            color: var(--ink);
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
        }

        .main-layout {
            max-width: 50rem;
            margin: 0 auto;
            padding: 2rem 1.25rem 4rem 1.25rem;
        }

        header {
            margin-bottom: 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            border-bottom: 2px solid var(--line);
            padding-bottom: 1.5rem;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            border-radius: 0.625rem;
            font-size: 0.875rem;
            font-weight: 700;
            cursor: pointer;
            border: none;
            text-decoration: none;
            height: 2.75rem;
            padding: 0 1.25rem;
        }
        .btn-outline { border: 1px solid var(--line); background: var(--card); color: var(--ink); }

        .chimp-card {
            background: var(--card);
            border: 2px solid var(--line);
            border-radius: 1.5rem;
            padding: 2.5rem 1.5rem;
            text-align: center;
            box-shadow: var(--shadow);
            margin-top: 1.5rem;
        }

        .chimp-img {
            max-width: 100%;
            width: 20rem;
            border-radius: 1.25rem;
            border: 3px solid var(--line);
            box-shadow: 0 15px 35px rgba(0,0,0,0.15);
            margin-top: 1.25rem;
            object-fit: cover;
        }
    </style>
</head>
<body>

<div class="main-layout">
    <header>
        <h1 style="font-size: 1.875rem; font-weight: 800; margin: 0;">🐒 Test Side</h1>
        <a href="index.html" class="btn btn-outline">🏠 Hovedmeny</a>
    </header>

    <div class="chimp-card">
        <h2 style="font-size: 2.25rem; font-weight: 800; color: #db2777; margin: 0 0 0.5rem 0;">din fleibede apekatt</h2>
        <p style="font-size: 0.9375rem; color: var(--muted); margin: 0 0 1.5rem 0;">Her er din personlige sjimpanse! 🐒</p>

        <!-- INLINE VEKTOR SJIMPANSE ILLUSTRASJON (100% GARANTERT SYNLIG OVERALT) -->
        <div style="display: flex; justify-content: center;">
            <svg width="240" height="240" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" style="filter: drop-shadow(0 15px 25px rgba(0,0,0,0.25));">
                <!-- Ører -->
                <circle cx="35" cy="95" r="28" fill="#4a2e1d" stroke="#2d1a0e" stroke-width="4"/>
                <circle cx="35" cy="95" r="18" fill="#dcae96"/>
                <circle cx="165" cy="95" r="28" fill="#4a2e1d" stroke="#2d1a0e" stroke-width="4"/>
                <circle cx="165" cy="95" r="18" fill="#dcae96"/>

                <!-- Hode pels -->
                <ellipse cx="100" cy="95" rx="60" ry="58" fill="#3a2214" stroke="#2d1a0e" stroke-width="4"/>

                <!-- Ansikt kontur -->
                <path d="M 65 85 C 65 65, 135 65, 135 85 C 135 105, 145 135, 100 145 C 55 135, 65 105, 65 85 Z" fill="#e8c2a8" stroke="#2d1a0e" stroke-width="3"/>

                <!-- Øyne -->
                <circle cx="80" cy="85" r="8" fill="#ffffff" stroke="#2d1a0e" stroke-width="2"/>
                <circle cx="80" cy="85" r="4" fill="#000000"/>
                <circle cx="120" cy="85" r="8" fill="#ffffff" stroke="#2d1a0e" stroke-width="2"/>
                <circle cx="120" cy="85" r="4" fill="#000000"/>

                <!-- Snute -->
                <ellipse cx="100" cy="115" rx="30" ry="22" fill="#dfb196" stroke="#2d1a0e" stroke-width="2"/>
                <ellipse cx="93" cy="108" rx="3" ry="2" fill="#2d1a0e"/>
                <ellipse cx="107" cy="108" rx="3" ry="2" fill="#2d1a0e"/>

                <!-- Glis -->
                <path d="M 82 120 Q 100 138 118 120" fill="none" stroke="#2d1a0e" stroke-width="4" stroke-linecap="round"/>
            </svg>
        </div>
    </div>
</div>

<script>
    if (localStorage.getItem('lonn_theme') === 'dark') {
        document.body.classList.add('dark-mode');
    }
</script>

</body>
</html>
