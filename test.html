<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Test Side - Sjimpanse</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #0284c7;
            --primary-deep: #0369a1;
            --card: #ffffff;
            --bg: #f1f5f9;
            --ink: #0f172a;
            --muted: #64748b;
            --line: #cbd5e1;
            --shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.08);
        }

        body.dark-mode {
            --primary: #38bdf8;
            --primary-deep: #0284c7;
            --card: #0f172a;
            --bg: #070a11;
            --ink: #f8fafc;
            --muted: #94a3b8;
            --line: #1e293b;
            --shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.6);
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg);
            color: var(--ink);
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
        }

        .main-layout {
            max-width: 50rem;
            margin: 0 auto;
            padding: 2rem 1.25rem 4rem 1.25rem;
        }

        header {
            margin-bottom: 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            border-bottom: 2px solid var(--line);
            padding-bottom: 1.5rem;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            border-radius: 0.625rem;
            font-size: 0.875rem;
            font-weight: 700;
            cursor: pointer;
            border: none;
            text-decoration: none;
            height: 2.75rem;
            padding: 0 1.25rem;
        }
        .btn-outline { border: 1px solid var(--line); background: var(--card); color: var(--ink); }

        .chimp-card {
            background: var(--card);
            border: 2px solid var(--line);
            border-radius: 1.5rem;
            padding: 2rem 1.5rem;
            text-align: center;
            box-shadow: var(--shadow);
            margin-top: 1.5rem;
        }

        .chimp-container {
            display: flex;
            justify-content: center;
            margin-top: 1.5rem;
        }

        .chimp-frame {
            border-radius: 1.5rem;
            border: 3px solid var(--line);
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            overflow: hidden;
            background: #1c130d;
            padding: 1rem;
            max-width: 100%;
            width: 22rem;
        }
    </style>
</head>
<body>

<div class="main-layout">
    <header>
        <h1 style="font-size: 1.875rem; font-weight: 800; margin: 0;">🐒 Test Side</h1>
        <a href="index.html" class="btn btn-outline">🏠 Hovedmeny</a>
    </header>

    <div class="chimp-card">
        <h2 style="font-size: 2.25rem; font-weight: 800; color: #db2777; margin: 0 0 0.5rem 0;">din fleibede apekatt</h2>
        <p style="font-size: 0.9375rem; color: var(--muted); margin: 0;">Innebygd grafikk (100% garantert synlig uten avbrudd)! 🐒</p>

        <!-- INNEBYGD REALISTISK SJIMPANSE - INGEN EKSTERNE BILDELENKER MÅ HENTES -->
        <div class="chimp-container">
            <div class="chimp-frame">
                <svg width="280" height="280" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
                    <!-- Bakgrunn Mørk Skog -->
                    <rect width="200" height="200" fill="#1e293b" rx="16"/>
                    <circle cx="100" cy="100" r="85" fill="#334155"/>

                    <!-- Sjimpanse skuldre/kropp -->
                    <path d="M 20 200 C 20 140, 180 140, 180 200 Z" fill="#120c08"/>

                    <!-- Store Ører med detaljer -->
                    <ellipse cx="30" cy="95" rx="26" ry="32" fill="#241710" stroke="#0e0805" stroke-width="3"/>
                    <ellipse cx="30" cy="95" rx="16" ry="22" fill="#c99b82"/>
                    <ellipse cx="170" cy="95" rx="26" ry="32" fill="#241710" stroke="#0e0805" stroke-width="3"/>
                    <ellipse cx="170" cy="95" rx="16" ry="22" fill="#c99b82"/>

                    <!-- Pels Hode -->
                    <ellipse cx="100" cy="90" rx="64" ry="60" fill="#1c120c" stroke="#0a0503" stroke-width="4"/>

                    <!-- Pannedel og bryn -->
                    <path d="M 50 80 Q 100 55 150 80 Q 100 68 50 80 Z" fill="#2b1c13"/>
                    <path d="M 55 80 C 60 62, 140 62, 145 80 C 145 110, 155 145, 100 152 C 45 145, 55 110, 55 80 Z" fill="#d8a88f" stroke="#1c120c" stroke-width="2"/>

                    <!-- Rynker i pannen -->
                    <path d="M 75 72 Q 100 68 125 72" stroke="#a67b65" stroke-width="2" fill="none"/>
                    <path d="M 80 77 Q 100 74 120 77" stroke="#a67b65" stroke-width="1.5" fill="none"/>

                    <!-- Dype Øyne -->
                    <ellipse cx="78" cy="88" rx="10" ry="8" fill="#1c120c"/>
                    <circle cx="78" cy="88" r="7" fill="#ffffff"/>
                    <circle cx="78" cy="88" r="4.5" fill="#3b2314"/>
                    <circle cx="78" cy="88" r="2.5" fill="#000000"/>
                    <circle cx="76" cy="86" r="1.2" fill="#ffffff"/>

                    <ellipse cx="122" cy="88" rx="10" ry="8" fill="#1c120c"/>
                    <circle cx="122" cy="88" r="7" fill="#ffffff"/>
                    <circle cx="122" cy="88" r="4.5" fill="#3b2314"/>
                    <circle cx="122" cy="88" r="2.5" fill="#000000"/>
                    <circle cx="120" cy="86" r="1.2" fill="#ffffff"/>

                    <!-- Snute med nesebor -->
                    <path d="M 72 108 C 72 98, 128 98, 128 108 C 128 135, 72 135, 72 108 Z" fill="#caa088" stroke="#1c120c" stroke-width="2"/>
                    <ellipse cx="92" cy="110" rx="3.5" ry="2" fill="#1c120c"/>
                    <ellipse cx="108" cy="110" rx="3.5" ry="2" fill="#1c120c"/>

                    <!-- Realistisk Munn / Glis -->
                    <path d="M 78 124 Q 100 142 122 124" fill="none" stroke="#1c120c" stroke-width="3.5" stroke-linecap="round"/>
                    <path d="M 84 126 Q 100 138 116 126" fill="none" stroke="#8a5e48" stroke-width="1.5"/>

                    <!-- Hake -->
                    <path d="M 85 142 Q 100 148 115 142" stroke="#a67b65" stroke-width="2" fill="none"/>
                </svg>
            </div>
        </div>
    </div>
</div>

<script>
    if (localStorage.getItem('lonn_theme') === 'dark') {
        document.body.classList.add('dark-mode');
    }
</script>

</body>
</html>
