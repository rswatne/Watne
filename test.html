<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Test Side</title>

    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #0284c7;
            --primary-deep: #0369a1;
            --card: #ffffff;
            --bg: #f1f5f9;
            --ink: #0f172a;
            --muted: #64748b;
            --line: #cbd5e1;
            --shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.08);
        }

        body.dark-mode {
            --primary: #38bdf8;
            --primary-deep: #0284c7;
            --card: #0f172a;
            --bg: #070a11;
            --ink: #f8fafc;
            --muted: #94a3b8;
            --line: #1e293b;
            --shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.6);
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg);
            color: var(--ink);
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
        }

        .main-layout {
            max-width: 50rem;
            margin: 0 auto;
            padding: 2rem 1.25rem 4rem 1.25rem;
        }

        header {
            margin-bottom: 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            border-bottom: 2px solid var(--line);
            padding-bottom: 1.5rem;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            border-radius: 0.625rem;
            font-size: 0.875rem;
            font-weight: 700;
            cursor: pointer;
            border: none;
            text-decoration: none;
            height: 2.75rem;
            padding: 0 1.25rem;
        }
        .btn-outline { border: 1px solid var(--line); background: var(--card); color: var(--ink); }

        .chimp-card {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 1.5rem;
            padding: 2rem;
            text-align: center;
            box-shadow: var(--shadow);
            margin-top: 1.5rem;
        }

        .chimp-img {
            max-width: 100%;
            width: 22rem;
            border-radius: 1.25rem;
            border: 3px solid var(--line);
            box-shadow: 0 15px 35px rgba(0,0,0,0.15);
            margin-top: 1.25rem;
            object-fit: cover;
        }
    </style>
</head>
<body>

<div class="main-layout">
    <header>
        <h1 style="font-size: 1.875rem; font-weight: 800; margin: 0;">🐒 Test Side</h1>
        <a href="index.html" class="btn btn-outline">🏠 Hovedmeny</a>
    </header>

    <div class="chimp-card">
        <h2 style="font-size: 2.25rem; font-weight: 800; color: var(--primary-deep); margin: 0 0 0.5rem 0;">din fleibede apekatt</h2>
        <p style="font-size: 0.9375rem; color: var(--muted); margin: 0;">Automatisk live-oppdateringstest for Verksted Portalen!</p>

        <!-- BILDER AV SJIMPANSE -->
        <div>
            <img src="https://images.unsplash.com/photo-1540573133985-780688d1728d?auto=format&fit=crop&w=800&q=80" alt="Sjimpanse" class="chimp-img">
        </div>
    </div>
</div>

<script>
    if (localStorage.getItem('lonn_theme') === 'dark') {
        document.body.classList.add('dark-mode');
    }
</script>

</body>
</html>
